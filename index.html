<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Herbier</title>
<meta name="theme-color" content="#E3E8DA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A16" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Herbier">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --paper:#E3E8DA; --label:#F1F3EB; --ink:#1E2620; --muted:#5D695E; --rule:#B7C1AE;
  --m:#2C6266; --f:#8A3B64; --v:#8F6219; --o:#5F6683; --leaf:#4E7A45;
  --serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans:"Alegreya Sans", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141A16; --label:#1D251F; --ink:#DCE3D5; --muted:#93A095; --rule:#34403A;
    --m:#73B3B6; --f:#D78CB5; --v:#D6A457; --o:#A4AACB; --leaf:#8DBB7F;
  }
}
:root[data-theme="dark"]{
  --paper:#141A16; --label:#1D251F; --ink:#DCE3D5; --muted:#93A095; --rule:#34403A;
  --m:#73B3B6; --f:#D78CB5; --v:#D6A457; --o:#A4AACB; --leaf:#8DBB7F;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:17px/1.5 var(--sans);display:grid;grid-template-columns:250px 1fr;grid-template-rows:auto;align-items:start;min-height:100vh}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}

/* ---------- sidebar ---------- */
aside{padding:28px 22px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh;overflow:auto}
.brand h1{font:italic 600 52px/0.9 var(--serif);margin:0;letter-spacing:-0.5px}
.brand p{margin:8px 0 0;color:var(--muted);font-size:15px;line-height:1.35}
.tally{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline}
.tally b{font:600 26px/1.1 var(--serif);text-align:right}
.tally span{color:var(--muted);font-size:15px}
nav{display:flex;flex-direction:column;gap:4px}
nav button{all:unset;cursor:pointer;padding:7px 10px;border-radius:6px;font-weight:500;display:flex;justify-content:space-between}
nav button[aria-current="true"]{background:var(--label)}
nav button .n{color:var(--muted);font-weight:400}
.filters{display:flex;flex-direction:column;gap:2px}
.filters h2,.side-h{font:500 14px var(--sans);color:var(--muted);margin:0 0 6px}
.filters button{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;padding:4px 10px;border-radius:6px}
.filters button[aria-pressed="true"]{background:var(--label)}
.filters .sym{width:18px;text-align:center;font:600 18px var(--serif)}
.filters .n{margin-left:auto;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:3px 12px;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--muted)}
.side-foot button{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- main ---------- */
main{padding:28px 36px 60px;min-width:0}
.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.search{flex:1;min-width:220px;max-width:460px;background:var(--label);border:1px solid var(--rule);border-radius:8px;padding:8px 14px}
.search::placeholder{color:var(--muted)}
.sort{color:var(--muted);font-size:15px;display:flex;gap:4px;align-items:center}
.sort{flex-wrap:wrap}
.sort button{all:unset;cursor:pointer;padding:3px 8px;border-radius:5px;white-space:nowrap}
.sort button[aria-pressed="true"]{color:var(--ink);background:var(--label)}

.sheet{columns:300px;column-gap:20px}
.spec{break-inside:avoid;margin:0 0 20px;background:var(--label);border:1px solid var(--rule);border-radius:3px;padding:16px 18px 12px;position:relative;
  box-shadow:inset 0 0 0 4px var(--label), inset 0 0 0 5px var(--rule)}
.spec .head{display:flex;align-items:baseline;gap:10px}
.spec .sex{font:600 26px/1 "Segoe UI Symbol", var(--sans);width:20px;flex:none}
.spec .lem{font:italic 600 30px/1.05 var(--serif);margin:0;overflow-wrap:anywhere}
.spec .art{font-style:normal;font-weight:500;color:var(--muted)}
.spec .pos{color:var(--muted);font-size:14px;margin:3px 0 0 28px}
.spec .tr{margin:10px 0 0 28px;font-size:17px}
.spec .hab{margin:12px 0 0 28px;padding-top:10px;border-top:1px dashed var(--rule);font:italic 500 17px/1.45 var(--serif);color:var(--muted)}
.spec .hab mark{background:none;color:var(--ink);font-weight:600;text-decoration:underline 1.5px;text-underline-offset:3px}
.spec footer{margin:12px 0 0 28px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:13.5px;color:var(--muted)}
.spec footer svg{flex:none}
.spec .del{position:absolute;top:8px;right:10px;all:unset;position:absolute;top:8px;right:12px;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;opacity:0}
.spec:hover .del,.spec .del:focus-visible{opacity:1}
.k-m .sex,.k-m .hab mark{color:var(--m)} .k-f .sex,.k-f .hab mark{color:var(--f)}
.k-v .sex,.k-v .hab mark{color:var(--v)} .k-o .sex,.k-o .hab mark{color:var(--o)}

.empty{max-width:520px;margin:12vh auto 0;text-align:center;color:var(--muted)}
.empty h2{font:italic 600 34px var(--serif);color:var(--ink);margin:0 0 10px}

/* ---------- review ---------- */
.review{max-width:620px;margin:6vh auto 0;text-align:center}
.review .left{color:var(--muted);font-size:15px;margin-bottom:14px}
.card{background:var(--label);border:1px solid var(--rule);border-radius:3px;padding:40px 36px 30px;box-shadow:inset 0 0 0 6px var(--label), inset 0 0 0 7px var(--rule)}
.card .sex{font:600 30px var(--serif)}
.card .lem{font:italic 600 54px/1 var(--serif);margin:6px 0 4px}
.card .pos{color:var(--muted)}
.card .hab{font:italic 500 21px/1.5 var(--serif);color:var(--muted);margin:22px auto 0;max-width:30em}
.card .hab mark{background:none;color:var(--ink);font-weight:600;text-decoration:underline 1.5px;text-underline-offset:4px}
.card .ans{margin-top:22px;padding-top:18px;border-top:1px dashed var(--rule);font-size:21px;animation:show .25s ease-out}
.card .ans .en{color:var(--muted);font-size:16px;margin-top:4px}
@keyframes show{from{opacity:0;transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.card .ans{animation:none}}
.acts{display:flex;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;padding:10px 20px;border-radius:8px;border:1px solid var(--rule);background:var(--label);font-weight:500}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn kbd{font:13px var(--sans);color:var(--muted);margin-left:8px}
.btn.primary kbd{color:inherit;opacity:.7}
.btn.again{color:var(--f)} .btn.good{color:var(--leaf)}

@media (max-width:760px){
  body{grid-template-columns:1fr}
  aside{position:static;height:auto;overflow:visible;border-right:0;border-bottom:1px solid var(--rule);padding:20px 16px}
  main{padding:20px 16px 50px}
  .card{padding:28px 18px 22px}
  .card .lem{font-size:42px}
}

/* ---------- sync panel / pairing ---------- */
.sync-pill{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.sync-pill i{width:8px;height:8px;border-radius:50%;background:var(--rule);flex:none}
.sync-pill.ok i{background:var(--leaf)} .sync-pill.err i{background:var(--f)} .sync-pill.busy i{background:var(--v)}
.panel{max-width:620px}
.panel h2{font:italic 600 38px/1.1 var(--serif);margin:0 0 6px}
.panel > p{color:var(--muted);margin:0 0 22px;max-width:34em}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field span{font-size:15px;color:var(--muted)}
.field input{background:var(--label);border:1px solid var(--rule);border-radius:8px;padding:9px 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{margin:14px 0 0;font-size:15px}
.msg.err{color:var(--f)} .msg.ok{color:var(--leaf)}
.qr-wrap{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;margin:8px 0 20px}
.qr{background:#fff;padding:14px;border-radius:6px;border:1px solid var(--rule);line-height:0}
.qr img,.qr canvas{width:220px;height:220px;image-rendering:pixelated}
.steps{margin:0;padding-left:20px;max-width:24em}
.steps li{margin-bottom:8px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin:0 0 18px}
.facts dt{color:var(--muted)} .facts dd{margin:0}
.pair{max-width:440px;margin:6vh auto 0;padding:0 4px}
.pair h2{font:italic 600 46px/1 var(--serif);margin:0 0 10px}
.pair p{color:var(--muted)}
details{margin-top:18px} summary{cursor:pointer;color:var(--muted)}
.topbar{display:none}
@media (max-width:760px){
  aside{display:none}
  body.menu-open aside{display:flex;position:fixed;inset:0;z-index:20;overflow:auto;background:var(--paper)}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;background:var(--paper);padding:10px 16px;border-bottom:1px solid var(--rule)}
  .topbar b{font:italic 600 30px/1 var(--serif);margin-right:auto}
  .topbar button{all:unset;cursor:pointer;padding:6px 10px;border-radius:7px;font-weight:500}
  .topbar button[aria-current="true"]{background:var(--label)}
  .close-menu{display:block !important}
  .sheet{columns:1}
}
.close-menu{all:unset;display:none;cursor:pointer;align-self:flex-end;font-size:28px;line-height:1;color:var(--muted)}

/* ---------- polish ---------- */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){color-scheme:dark} }
:root[data-theme="dark"]{color-scheme:dark}
body{font-variant-numeric:lining-nums tabular-nums}
.tally b{font:600 24px/1.15 var(--sans);font-variant-numeric:lining-nums tabular-nums}
*{scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--rule);border-radius:8px} ::-webkit-scrollbar-button{display:none}
aside{overflow-y:auto;overflow-x:hidden}
.filters button{line-height:1.3;padding:5px 10px}
.spec .pos .theme{color:var(--leaf)}
.filters button.zero{color:var(--muted);opacity:.6}

/* ---------- edit + reverse review ---------- */
.spec .edit{all:unset;position:absolute;top:9px;right:40px;cursor:pointer;color:var(--muted);font-size:17px;line-height:1;opacity:0}
.spec:hover .edit,.spec .edit:focus-visible{opacity:1}
.spec.editing{box-shadow:inset 0 0 0 4px var(--label), inset 0 0 0 5px var(--leaf)}
.spec.editing .field{margin:10px 0 0}
.spec textarea,.spec select{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font:inherit;color:inherit;width:100%;resize:vertical}
.spec.editing .row{margin-top:12px}
.review .left{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.card .ask{font:600 34px/1.2 var(--sans);margin:4px 0 6px}
.card .hab mark.gap{text-decoration:none;color:var(--muted);letter-spacing:2px}
@media (hover:none){ .spec .del,.spec .edit{opacity:1} }
@media (max-width:760px){
  body{grid-template-columns:minmax(0,1fr)}
  .topbar{gap:4px;padding:10px 12px}
  .topbar b{font-size:26px}
  .topbar button{padding:6px 8px;white-space:nowrap}
  .search{min-width:0;width:100%;max-width:none;flex-basis:100%}
}

.k-i .sex,.k-i .hab mark{color:#8a4fbf}
@media (prefers-color-scheme: dark){ .k-i .sex,.k-i .hab mark{color:#c79be8} }
.k-i .lem{font-size:26px}
</style>
</head>
<body>
<div class="topbar">
  <b>Herbier</b>
  <button id="tbList" aria-current="true">Гербарий</button>
  <button id="tbRev" aria-current="false">Повторить <span id="tbDue"></span></button>
  <button id="tbMenu" aria-label="Меню">☰</button>
</div>
<aside>
  <button class="close-menu" id="closeMenu" aria-label="Закрыть меню">×</button>
  <div class="brand">
    <h1>Herbier</h1>
    <p>Слова, которые ты собрал в Greenhearth</p>
  </div>
  <div class="tally" id="tally"></div>
  <nav>
    <button id="navList" aria-current="true">Гербарий <span class="n" id="nList"></span></button>
    <button id="navRev" aria-current="false">Повторение <span class="n" id="nDue"></span></button>
    <button id="navSync" aria-current="false">Синхронизация <span class="n" id="nSync"></span></button>
  </nav>
  <div class="filters" id="filters"><h2>Показывать</h2></div>
  <div>
    <div class="side-h">Перевод</div>
    <div class="seg" id="lang"><button data-l="ru" aria-pressed="true">RU</button><button data-l="en" aria-pressed="false">EN</button></div>
  </div>
  <div class="side-foot">
    <div class="sync-pill" id="syncPill"><i></i><span></span></div>
    <button id="anki" class="local-only">Сохранить файл для Anki</button>
    <button id="folder" class="local-only">Открыть папку со словарём</button>
    <span id="status"></span>
  </div>
</aside>
<main id="main"></main>

        for (var c = -1; c <= 7; c += 1) {

              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {

          } else {

let editKey = null;
const POS_LIST = ['n.m.', 'n.f.', 'n.', 'v.', 'adj.', 'adv.', 'prep.', 'conj.', 'pron.', 'interj.', 'loc.', 'nom propre'];
function editHTML(v) {
  const k = kind(v.p), pos = POS_LIST.includes(v.p) ? POS_LIST : [v.p].concat(POS_LIST);
  return `<article class="spec k-${k === 'a' ? 'v' : k} editing" data-l="${esc(v.l)}">
    <div class="head"><span class="sex" aria-hidden="true">${SYM[k]}</span><h3 class="lem">${esc(v.l)}</h3></div>
    <label class="field"><span>Перевод на русский</span><textarea id="eRu" rows="2">${esc(v.ru)}</textarea></label>
    <label class="field"><span>Перевод на английский</span><input id="eEn" value="${esc(v.en)}"></label>
    <div class="row">
      <label class="field" style="flex:1"><span>Часть речи</span><select id="eP">${pos.map(p => `<option value="${esc(p)}"${p === v.p ? ' selected' : ''}>${esc(POSRU[p] || p)}</option>`).join('')}</select></label>
      <label class="field" style="flex:1.4"><span>Тема</span><select id="eTh">${THEMES.map(t => `<option value="${t[0]}"${t[0] === v.th ? ' selected' : ''}>${esc(t[1])}</option>`).join('')}</select></label>
    </div>
    <div class="row"><button class="btn primary" id="eSave">Сохранить</button><button class="btn" id="eCancel">Отмена</button></div>
  </article>`;
}
async function saveEdit(l) {
  const f = { ru: $('eRu').value.trim(), en: $('eEn').value.trim(), p: $('eP').value, th: $('eTh').value };
  const v = V.find(x => key(x.l) === key(l)); if (v) Object.assign(v, f, { ed: Date.now() });
  editKey = null; render(); setStatus(`«${l}» сохранено`);
  await B.edit(l, f);
}
function specHTML(v) {
  if (editKey === key(v.l)) return editHTML(v);
  const k = isIdiom(v) ? 'i' : kind(v.p), st = stage(v.l), tr = lang === 'en' ? v.en : v.ru;
  const seen = v.s > 1 ? `в игре встречено ${v.s} ${plural(v.s, 'раз', 'раза', 'раз')}` : '';
  return `<article class="spec k-${k === 'a' ? 'v' : k}">
    <button class="del" data-l="${esc(v.l)}" title="Убрать из гербария" aria-label="Удалить ${esc(v.l)}">×</button>
    <button class="edit" data-l="${esc(v.l)}" title="Исправить перевод, часть речи или тему" aria-label="Изменить ${esc(v.l)}">✎</button>
    <div class="head"><span class="sex" aria-hidden="true">${SYM[k]}</span><h3 class="lem"><span class="art">${article(v)}</span>${esc(v.l)}</h3></div>
    <div class="pos">${esc(posName(v.p))}${filt === 'all' && v.th ? ` · <span class="theme">${esc(themeName(themeOf(v)))}</span>` : ''}</div>
    <div class="tr">${esc(tr) || '<span style="color:var(--muted)">перевода нет</span>'}</div>
    ${v.c ? `<div class="hab">«&#8239;${habitat(v)}&#8239;»</div>` : ''}
    <footer>${glyph(st)}<span>${(lang === 'en' ? STAGES_EN : STAGES_RU)[st]}</span>${seen ? `<span>${seen}</span>` : ''}<span style="margin-left:auto">${fmtDate(v.d)}</span></footer>
  </article>`;
}

function emptyHTML() {
  if (MODE === 'github' && !GH.cfg) return pairHTML();
  return `<div class="empty"><h2>Гербарий пока пуст</h2><p>В игре зажми Shift, наведи на незнакомое слово и кликни мышкой. Оно появится здесь вместе с фразой, где ты его нашёл.</p></div>`;
}

function renderList() {
  const main = $('main');
  if (!V.length) { main.innerHTML = emptyHTML(); bindPair(); return; }
  let list = V.filter(inFilter);
  if (q) { const s = q.toLowerCase(); list = list.filter(v => [v.l, v.w, v.ru, v.en, v.c].some(x => (x || '').toLowerCase().includes(s))); }
  const coll = new Intl.Collator('fr');
  list = list.map((v, i) => [v, i]);
  if (sort === 'new') list.sort((a, b) => (b[0].d || '').localeCompare(a[0].d || '') || b[1] - a[1]);
  if (sort === 'az') list.sort((a, b) => coll.compare(a[0].l, b[0].l));
  if (sort === 'seen') list.sort((a, b) => (b[0].s || 0) - (a[0].s || 0));
  if (sort === 'weak') list.sort((a, b) => prog(a[0].l).b - prog(b[0].l).b || prog(a[0].l).due - prog(b[0].l).due);
  list = list.map(x => x[0]);
  main.innerHTML = `
    <div class="bar">
      <input class="search" id="q" type="search" placeholder="Найти слово, перевод или фразу" value="${esc(q)}" aria-label="Поиск">
      <div class="sort">Порядок:
        ${[['new', 'новые'], ['az', 'А–Я'], ['seen', 'частые в игре'], ['weak', 'слабые']].map(([k, n]) => `<button data-s="${k}" aria-pressed="${sort === k}">${n}</button>`).join('')}
      </div>
    </div>
    ${list.length ? `<div class="sheet">${list.map(specHTML).join('')}</div>` : `<div class="empty"><p>Ничего не нашлось.</p></div>`}`;
  const qi = $('q');
  qi.oninput = () => { q = qi.value; const pos = qi.selectionStart; renderList(); const n = $('q'); n.focus(); n.setSelectionRange(pos, pos); };
  main.querySelectorAll('.sort button').forEach(b => b.onclick = () => { sort = b.dataset.s; renderList(); });
  main.querySelectorAll('.del').forEach(b => b.onclick = () => del(b.dataset.l));
  main.querySelectorAll('.edit').forEach(b => b.onclick = () => { editKey = key(b.dataset.l); renderList(); const t = $('eRu'); if (t) t.focus(); });
  const es = $('eSave'); if (es) { es.onclick = () => saveEdit(es.closest('.spec').dataset.l); $('eCancel').onclick = () => { editKey = null; renderList(); }; }
}

// ---------------- review ----------------
let queue = [], cur = null, shown = false, curDir = 'fr';
let dir = (() => { const d = store('herbier-dir'); return d === 'ru' || d === 'mix' ? d : 'fr'; })();
const masked = (v, col) => habitat(v, col).replace(/<mark[^>]*>[\s\S]*?<\/mark>/, '<mark class="gap">＿＿＿</mark>');
function buildQueue() {
  queue = V.filter(v => inFilter(v) && isDue(v.l)).sort((a, b) => prog(a.l).due - prog(b.l).due).slice(0, 40);
  for (let i = queue.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [queue[i], queue[j]] = [queue[j], queue[i]]; }
}
function renderReview() {
  const main = $('main');
  if (MODE === 'github' && !GH.cfg) { main.innerHTML = pairHTML(); bindPair(); return; }
  if (!cur) { cur = queue.shift() || null; shown = false; curDir = dir === 'mix' ? (Math.random() < 0.5 ? 'fr' : 'ru') : dir; }
  if (!cur) {
    const next = V.map(v => prog(v.l).due).filter(d => d > Date.now()).sort((a, b) => a - b)[0];
    const when = next ? new Date(next).toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' }) : null;
    main.innerHTML = `<div class="empty"><h2>${V.length ? (filt !== 'all' ? 'В этой теме на сегодня всё' : 'На сегодня всё') : 'Повторять пока нечего'}</h2><p>${V.length ? (when ? `Следующие слова созреют для повторения: ${when}.` : '') : 'Сначала собери несколько слов в игре: Shift + клик по слову.'}</p>${V.length ? '<p><button class="btn" id="back">Вернуться в гербарий</button></p>' : ''}</div>`;
    const b = $('back'); if (b) b.onclick = () => { view = 'list'; render(); };
    return;
  }
  const v = cur, k = kind(v.p), tr = lang === 'en' ? v.en : v.ru, other = lang === 'en' ? v.ru : v.en, col = kcol(k);
  const dirBar = `<div class="seg dirseg" role="group" aria-label="Направление">${[['fr', 'FR → RU'], ['ru', 'RU → FR'], ['mix', 'вперемешку']].map(([d, n]) => `<button data-d="${d}" aria-pressed="${dir === d}">${n}</button>`).join('')}</div>`;
  const art = `<span class="art" style="font-style:normal;color:var(--muted);font-weight:500">${article(v)}</span>`;
  const front = curDir === 'fr'
    ? `<div class="sex" style="color:${col}">${SYM[k]}</div>
       <div class="lem">${art}${esc(v.l)}</div>
       <div class="pos">${esc(posName(v.p))}</div>
       ${v.c ? `<div class="hab">«&#8239;${habitat(v, col)}&#8239;»</div>` : ''}
       ${shown ? `<div class="ans">${esc(tr)}<div class="en">${esc(other)}</div></div>` : ''}`
    : `<div class="ask">${esc(tr) || esc(other)}</div>
       <div class="pos">${esc(posName(v.p))}${v.th ? ' · ' + esc(themeName(themeOf(v))) : ''}</div>
       ${v.c ? `<div class="hab">«&#8239;${shown ? habitat(v, col) : masked(v, col)}&#8239;»</div>` : ''}
       ${shown ? `<div class="ans"><div class="sex" style="color:${col}">${SYM[k]}</div><div class="lem">${art}${esc(v.l)}</div></div>` : ''}`;
  main.innerHTML = `<div class="review">
    <div class="left">${dirBar}<span>${filt !== 'all' ? esc(themeName(filt)) + ' · ' : ''}осталось ${queue.length + 1}</span></div>
    <div class="card">${front}</div>
    <div class="acts">${shown
      ? `<button class="btn again" data-g="0">Не помню<kbd>1</kbd></button><button class="btn" data-g="1">С трудом<kbd>2</kbd></button><button class="btn good" data-g="2">Помню<kbd>3</kbd></button>`
      : `<button class="btn primary" id="show">${curDir === 'fr' ? 'Показать перевод' : 'Показать французское слово'}<kbd>пробел</kbd></button>`}</div>
  </div>`;
  main.querySelectorAll('.dirseg button').forEach(bt => bt.onclick = () => { dir = bt.dataset.d; store('herbier-dir', dir); curDir = dir === 'mix' ? curDir : dir; shown = false; renderReview(); });
  const s = $('show'); if (s) { s.onclick = () => { shown = true; renderReview(); }; s.focus({ preventScroll: true }); }
  main.querySelectorAll('[data-g]').forEach(b => b.onclick = () => grade(+b.dataset.g));
}
function grade(g) {
  if (!cur) return;
  const p = Object.assign({ b: 0, due: 0, n: 0 }, P[key(cur.l)]);
  if (g === 0) { p.b = Math.max(0, p.b - 2); p.due = Date.now() + 10 * 60 * 1000; queue.splice(Math.min(3, queue.length), 0, cur); }
  else if (g === 1) { p.due = Date.now() + Math.max(1, BOX[p.b]) * DAY * 0.6; }
  else { p.b = Math.min(BOX.length - 1, p.b + 1); p.due = Date.now() + BOX[p.b] * DAY; }
  p.n++; p.t = Date.now(); P[key(cur.l)] = p;
  B.review(cur.l, p);
  cur = null; renderSide(); renderReview();
}
document.addEventListener('keydown', e => {
  if (view !== 'rev' || e.target.tagName === 'INPUT') return;
  if (!shown && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); shown = true; renderReview(); }
  else if (shown && ['Digit1', 'Digit2', 'Digit3', 'Numpad1', 'Numpad2', 'Numpad3'].includes(e.code)) grade(+e.code.slice(-1) - 1);
});
async function del(l) {
  V = V.filter(v => key(v.l) !== key(l)); delete P[key(l)];
  render(); setStatus(`«${l}» убрано`);
  await B.del(l);
}

// ---------------- sync / pairing ----------------
function pairHTML() {
  return `<div class="pair">
    <h2>Herbier</h2>
    <p>Это твой гербарий на телефоне. Чтобы подключить его к словам из игры, открой Herbier на компьютере, выбери «Синхронизация» и отсканируй QR-код камерой телефона.</p>
    <label class="field" style="margin-top:18px"><span>Или вставь ссылку подключения из Herbier на компьютере</span><input id="pLink" placeholder="https://jisien0.github.io/herbier/#pair=…" autocomplete="off"></label>
    <button class="btn primary" id="pLinkGo">Подключить</button>
    <div class="msg" id="pLinkMsg"></div>
    <details><summary>Ввести ключ вручную</summary>
      <div style="margin-top:12px">
        <label class="field"><span>Репозиторий с данными</span><input id="pRepo" value="${DEFAULT_REPO}"></label>
        <label class="field"><span>Ключ доступа (github_pat_…)</span><input id="pTok" type="password" autocomplete="off"></label>
        <button class="btn primary" id="pSave">Подключить</button>
        <div class="msg" id="pMsg"></div>
      </div>
    </details>
  </div>`;
}
function bindPair() {
  const lg = $('pLinkGo');
  if (lg) lg.onclick = async () => {
    const m = ($('pLink').value || '').match(/pair=([A-Za-z0-9_\-=]+)/);
    if (!m) { $('pLinkMsg').className = 'msg err'; $('pLinkMsg').textContent = 'Это не ссылка подключения. Скопируй её в Herbier на компьютере: «Синхронизация» → «Скопировать ссылку».'; return; }
    location.hash = 'pair=' + m[1];
  };
  const b = $('pSave'); if (!b) return;
  b.onclick = async () => {
    const r = $('pRepo').value.trim(), t = $('pTok').value.trim();
    if (!r || !t) return;
    GH.cfg = { r, t }; store('herbier-cfg', JSON.stringify(GH.cfg));
    $('pMsg').textContent = 'Проверяю…';
    const ok = await GH.load();
    if (!ok && GH.error) { $('pMsg').className = 'msg err'; $('pMsg').textContent = GH.error; GH.cfg = null; store('herbier-cfg', null); return; }
    render();
  };
}

async function renderSync() {
  const main = $('main');
  if (MODE === 'github') {
    if (!GH.cfg) { main.innerHTML = pairHTML(); bindPair(); return; }
    main.innerHTML = `<div class="panel">
      <h2>Синхронизация</h2>
      <p>Гербарий на этом телефоне связан с твоими словами из игры. Новые слова с компьютера появляются здесь сами, а повторения отсюда видны на компьютере.</p>
      <dl class="facts"><dt>Данные</dt><dd>${esc(GH.cfg.r)}</dd><dt>Последняя синхронизация</dt><dd>${ago(GH.lastOk)}</dd><dt>Ждёт отправки</dt><dd>${GH.pending.length}</dd></dl>
      <div class="row"><button class="btn primary" id="sNow">Синхронизировать сейчас</button><button class="btn" id="sOff">Отключить этот телефон</button></div>
      <div class="msg ${GH.error ? 'err' : ''}" id="sMsg">${esc(GH.error)}</div>
    </div>`;
    $('sNow').onclick = async () => { $('sMsg').className = 'msg'; $('sMsg').textContent = 'Синхронизирую…'; await GH.push(); const ok = await GH.load(); $('sMsg').className = 'msg ' + (ok ? 'ok' : 'err'); $('sMsg').textContent = ok ? 'Готово' : GH.error; renderSide(); };
    $('sOff').onclick = () => { store('herbier-cfg', null); store('herbier-cache', null); store('herbier-pending', null); GH.cfg = null; V = []; P = {}; render(); };
    return;
  }
  // local (PC)
  let cfg = {};
  try { cfg = await (await fetch('/api/sync/config', { cache: 'no-store' })).json(); } catch { }
  if (!cfg.configured) {
    main.innerHTML = `<div class="panel">
      <h2>Гербарий на телефоне</h2>
      <p>Слова и прогресс будут храниться в твоём закрытом репозитории на GitHub. Тогда на телефоне гербарий работает где угодно, даже когда компьютер выключен.</p>
      <label class="field"><span>Репозиторий с данными</span><input id="cRepo" value="${esc(cfg.repo || DEFAULT_REPO)}"></label>
      <label class="field"><span>Ключ доступа (github_pat_…)</span><input id="cTok" type="password" autocomplete="off" placeholder="Вставь ключ, который создал на GitHub"></label>
      <button class="btn primary" id="cSave">Подключить</button>
      <div class="msg" id="cMsg"></div>
    </div>`;
    $('cSave').onclick = async () => {
      const m = $('cMsg'); m.className = 'msg'; m.textContent = 'Проверяю доступ к GitHub…';
      const r = await Local.post('/api/sync/config', { repo: $('cRepo').value.trim(), token: $('cTok').value.trim() });
      if (r && r.ok) { await Local.load(true); renderSync(); renderSide(); }
      else { m.className = 'msg err'; m.textContent = (r && r.error) || 'Не получилось подключиться'; }
    };
    return;
  }
  const pairUrl = APP_URL + '#pair=' + btoa(unescape(encodeURIComponent(JSON.stringify({ r: cfg.repo, t: cfg.token })))).replace(/\+/g, '-').replace(/\//g, '_');
  main.innerHTML = `<div class="panel">
    <h2>Гербарий на телефоне</h2>
    <p>Синхронизация включена: новые слова из игры уходят в твой репозиторий, а повторения с телефона возвращаются сюда.</p>
    <div class="qr-wrap">
      <div class="qr" id="qr" aria-label="QR-код для телефона"></div>
      <ol class="steps">
        <li>Открой камеру на телефоне и наведи на код.</li>
        <li>Перейди по ссылке, гербарий откроется уже подключённым.</li>
        <li>Добавь страницу на главный экран: в Safari «Поделиться → На экран Домой», в Chrome «⋮ → Добавить на главный экран».</li>
      </ol>
    </div>
    <dl class="facts"><dt>Данные</dt><dd>${esc(cfg.repo)}</dd><dt>Последняя синхронизация</dt><dd>${ago(cfg.last)}</dd>${cfg.error ? `<dt>Ошибка</dt><dd style="color:var(--f)">${esc(cfg.error)}</dd>` : ''}</dl>
    <div class="row"><button class="btn" id="sCopy">Скопировать ссылку для телефона</button><button class="btn primary" id="sNow">Синхронизировать сейчас</button><button class="btn" id="sOff">Отключить синхронизацию</button></div>
    <div class="msg" id="sMsg"></div>
    <p style="font-size:14px;margin-top:22px">Для iPhone: перешли себе эту ссылку (например, в Telegram «Избранное»), открой Herbier с главного экрана и вставь её в поле «Ссылка подключения».<br>Этот QR-код содержит твой ключ доступа. Не показывай его другим людям.</p>
  </div>`;
  drawQR($('qr'), pairUrl);
  $('sCopy').onclick = async () => {
    const m = $('sMsg');
    try { await navigator.clipboard.writeText(pairUrl); m.className = 'msg ok'; m.textContent = 'Ссылка скопирована. Не пересылай её другим людям: в ней твой ключ.'; }
    catch { m.className = 'msg'; m.textContent = pairUrl; }
  };
  $('sNow').onclick = async () => { const m = $('sMsg'); m.className = 'msg'; m.textContent = 'Синхронизирую…'; const r = await Local.post('/api/sync/now'); m.className = 'msg ' + (r && r.ok ? 'ok' : 'err'); m.textContent = r && r.ok ? 'Готово' : ((r && r.error) || 'Не получилось'); await Local.load(true); renderSide(); };
  $('sOff').onclick = async () => { await Local.post('/api/sync/config', { off: true }); await Local.load(true); renderSync(); renderSide(); };
}
function drawQR(el, text) {
  try {
    const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
    el.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    const svg = el.querySelector('svg'); if (svg) { svg.setAttribute('width', '220'); svg.setAttribute('height', '220'); }
  } catch { el.style.lineHeight = '1.4'; el.textContent = 'Не получилось нарисовать QR-код.'; }
}

// ---------------- shell ----------------
function render() {
  document.body.dataset.mode = MODE;
  document.querySelectorAll('.local-only').forEach(e => e.hidden = MODE !== 'local');
  renderSide();
  if (view === 'list') renderList();
  else if (view === 'rev') { if (!queue.length && !cur) buildQueue(); renderReview(); }
  else renderSync();
}
function go(v) { view = v; if (v === 'rev') { queue = []; cur = null; buildQueue(); } closeMenu(); render(); window.scrollTo(0, 0); }
function closeMenu() { document.body.classList.remove('menu-open'); }
$('navList').onclick = $('tbList').onclick = () => go('list');
$('navRev').onclick = $('tbRev').onclick = () => go('rev');
$('navSync').onclick = () => go('sync');
$('tbMenu').onclick = () => document.body.classList.add('menu-open');
$('closeMenu').onclick = closeMenu;
document.querySelectorAll('#lang button').forEach(b => b.onclick = () => {
  lang = b.dataset.l; document.querySelectorAll('#lang button').forEach(x => x.setAttribute('aria-pressed', x === b));
  store('herbier-lang', lang); render();
});
{ const l = store('herbier-lang'); if (l === 'en' || l === 'ru') { lang = l; document.querySelectorAll('#lang button').forEach(x => x.setAttribute('aria-pressed', x.dataset.l === l)); } }
$('anki').onclick = async () => { const r = await Local.post('/api/anki'); if (r) setStatus('Файл для Anki сохранён в папке словаря'); };
$('folder').onclick = () => Local.post('/api/folder');

async function refresh(force) {
  const changed = await B.load(force);
  if (changed || force) { if (view === 'list' || (view === 'rev' && !cur)) render(); else renderSide(); }
  else renderPill();
}
if (MODE === 'github') {
  GH.init();
  window.addEventListener('hashchange', () => { if (/pair=/.test(location.hash)) { GH.init(); refresh(true); } });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(false); else GH.push(); });
  setInterval(() => { if (!document.hidden) refresh(false); }, 60000);
} else if (MODE === 'local') {
  setInterval(() => refresh(false), 3000);   // picks up words added in the game
  window.addEventListener('pagehide', () => { try { navigator.sendBeacon('/api/bye'); } catch { } });
} else if (window.SAMPLE) { V = SAMPLE.vocab; P = SAMPLE.progress; }
render();
refresh(true);
</script>
</body>
